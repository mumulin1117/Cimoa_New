# Nginx snippet. Install outside the public document root, for example:
# /etc/nginx/snippets/cimoa-security-headers.conf
# Include again inside locations that define their own add_header directives;
# otherwise Nginx's normal add_header inheritance can drop the server headers.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
